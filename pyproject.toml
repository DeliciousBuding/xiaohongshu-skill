[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaohongshu-skill"
version = "1.3.0"
description = "Xiaohongshu AI Agent toolkit for search, publishing, interaction, and content workflows"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "DeliciousBuding"},
]
keywords = ["xiaohongshu", "rednote", "小红书", "social-media", "automation", "agent-skill"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
    "playwright>=1.40.0,<2",
    "markdown>=3.5,<4",
    "Pygments>=2.17,<3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-mock==3.15.1",
    "ruff==0.15.20",
    "skills-ref==0.1.1; python_version >= '3.11'",
]

[project.scripts]
xiaohongshu-skill = "scripts.__main__:main"

[project.urls]
Homepage = "https://github.com/DeliciousBuding/xiaohongshu-skill"
Issues = "https://github.com/DeliciousBuding/xiaohongshu-skill/issues"

[tool.setuptools.packages.find]
include = ["scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-p no:cacheprovider"
markers = [
    "live: tests that touch a real Xiaohongshu account or network session",
    "e2e: browser end-to-end tests that are opt-in only",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
